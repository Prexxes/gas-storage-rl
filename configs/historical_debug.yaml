environment_config:
  environment_name: historical_calibrated
  capacity: 30
  episode_length: 30
  injection_rate: 1.0
  withdrawal_rate: 1.0
  initial_inventory: 0.0
  target_terminal_inventory: 0.0
  initial_inventory_mean_fraction: 0.30
  initial_inventory_std_fraction: 0.05
  price_scale: 50.0
  reward_scale: 50.0
  penalty_factor: 1.0
  efficiency: 1.0
  transaction_cost: 0.0
  leakage: 0.0
dataset_config:
  n_pretrain_paths: 5000
  n_train_paths: 16
  n_validation_paths: 4
  n_test_paths: 4
  cache_dir: data/cache
  backtest_cache_dir: data/cache/backtest
  use_cache: true
  force_regenerate: false
historical_data_config:
  monthly_calibration_csv: data/gas_price_data_splits/monthly_calibration_2016_2024.csv
  daily_calibration_csv: data/gas_price_data_splits/daily_calibration_calendar_ffill_2022_2024.csv
  daily_backtest_csv: data/gas_price_data_splits/daily_backtest_tradingdays_2025_2026.csv
  calibration_end_date: "2024-12-31"
  backtest_start_date: "2025-01-01"
calibrated_price_process_config:
  enabled: true
  environment_name: historical_calibrated
  jump_threshold_sigma: 3.0
  backtest_window_stride: 1
training_config: {total_timesteps: 32, eval_freq: 16, n_seeds: 1}
evaluation_config: {deterministic: true, lsmc_action_grid: [-1.0, -0.5, 0.0, 0.5, 1.0], lsmc_n_inventory_levels: 21}
plotting_config: {plot_split: validation, plot_n_paths: 4}
seeds: {master_seed: 101, dataset_seed: 1101, env_seed: 1102, agent_seed: 1103, eval_seed: 1104, plot_seed: 1105}
price_process_config: {base_price: 50.0, seasonal_amplitude: 0.25, seasonal_phase: 0.0, ou_mean_reversion: 0.08, ou_volatility: 0.12, jump_probability: 0.02, jump_mean: 0.0, jump_std: 0.35, stress_probability: 0.005, stress_multiplier: 1.5}
agent_config:
  ppo: {policy: MlpPolicy, device: cpu, gamma: 1.0, n_steps: 8, batch_size: 4, n_epochs: 1}
  sac: {policy: MlpPolicy, device: cpu, learning_starts: 1, batch_size: 4, train_freq: 1, gradient_steps: 1, buffer_size: 100}
  td3: {policy: MlpPolicy, device: cpu, learning_starts: 1, batch_size: 4, train_freq: 1, gradient_steps: 1, buffer_size: 100}
logging_config: {run_dir: runs}
